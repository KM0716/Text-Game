<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>代号：ZDay · 通行证</title>

    <!--
    ============================================================================
    ⚠ 安全风险提醒（务必阅读）⚠
    ----------------------------------------------------------------------------
    1. 前端代码内嵌 OTS AccessKey/Secret 属于明文泄露，任何访问者均可通过
       浏览器开发者工具查看密钥并盗用您的阿里云账号，请仅用于个人测试。
    2. 前端对密码进行 SHA256 哈希仅能避免明文传输，无法抵御中间人攻击、
       重放攻击或密钥泄露后的恶意写入。正式商用必须通过后端中转签名。
    3. 本页严禁大范围公开部署到生产环境，建议仅在本地或私人 Github Pages
       上自娱测试。RAM 权限策略应严格限制为「仅允许读写 user_config 表」。
    4. 因前端密钥泄露导致的任何损失（数据被篡改、流量盗刷、账号封禁等）
       由部署者自行承担，与代码作者无关。
    ============================================================================
    -->

    <!-- CryptoJS：用于密码 SHA256 哈希 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <!-- 阿里云表格存储 OTS 官方 JS SDK（CDN 引入，浏览器环境可能存在兼容性问题，详见代码注释） -->
    <script src="https://cdn.jsdelivr.net/npm/tablestore@5.1.0/dist/tablestore.js"></script>

    <style>
        /* ============== 主题变量：与 game.html 手绘感保持一致 ============== */
        :root {
            --bg: #f5f0e6;
            --bg-paper: #fdfaf2;
            --bg-paper-alt: #f8f3e8;
            --text: #3a3226;
            --text-secondary: #6b5e4e;
            --text-muted: #8c7e6e;
            --border: #3a3a3a;
            --border-light: #c0b090;
            --shadow: rgba(58, 50, 38, 0.08);
            --shadow-dark: rgba(30, 25, 18, 0.14);
            --accent: #8b4513;
            --ink: #2e2e2e;
            --ink-light: #5a4a3a;
            --ink-soft: #6b5e4e;
            --input-bg: #fffef9;
            --input-border: #c0b090;
            --button-bg: #fffef5;
            --button-hover: #faf5e8;
            --overlay: rgba(30, 22, 14, 0.55);
            --modal-bg: #fdfaf3;
            --modal-border: #3a3a3a;
            --divider: #d8ceb8;
            --color-danger: #a04040;
            --color-warn: #c4a040;
            --color-success: #4a7b3a;
            --color-info: #4a6a8b;
            --font-main: 'SimHei', 'Heiti SC', 'Microsoft YaHei', 'WenQuanYi Micro Hei', 'Noto Sans SC', 'PingFang SC', sans-serif;
            --font-mono: 'Courier New', monospace;
        }
        [data-theme="dark"] {
            --bg: #1e1c18;
            --bg-paper: #2a2620;
            --bg-paper-alt: #252118;
            --text: #e0d8c8;
            --text-secondary: #c4b8a4;
            --text-muted: #a09480;
            --border: #5a5040;
            --border-light: #6b5e4a;
            --accent: #c4864a;
            --ink: #d8ccb8;
            --ink-light: #b8a890;
            --ink-soft: #a09480;
            --input-bg: #2c2822;
            --input-border: #5a5040;
            --button-bg: #2c2822;
            --button-hover: #363026;
            --overlay: rgba(0, 0, 0, 0.65);
            --modal-bg: #2a2620;
            --modal-border: #5a5040;
            --divider: #4a4035;
        }

        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            min-height: 100vh;
            line-height: 1.6;
        }
        body {
            background-image:
                radial-gradient(circle at 20% 30%, rgba(139,69,19,0.04) 0, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(139,69,19,0.03) 0, transparent 40%);
        }

        /* ============== 顶部栏 ============== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 18px;
            background: var(--bg-paper);
            border-bottom: 2px solid var(--border);
            box-shadow: 0 2px 0 var(--shadow-dark);
        }
        .top-title {
            font-size: 1.05rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--ink);
        }
        .top-title .logo { color: var(--accent); margin-right: 6px; }
        .top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .session-info {
            font-size: 0.75rem;
            color: var(--text-secondary);
            padding: 4px 10px;
            background: var(--bg-paper-alt);
            border: 1.5px dashed var(--border-light);
            border-radius: 4px;
            margin-right: 6px;
        }
        .session-info.guest { color: var(--color-warn); }
        .session-info.cloud { color: var(--color-success); }
        .session-info .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
        .session-info.guest .dot { background: var(--color-warn); }
        .session-info.cloud .dot { background: var(--color-success); }

        /* ============== 按钮通用 ============== */
        .btn {
            font-family: var(--font-main);
            font-size: 0.78rem;
            padding: 7px 16px;
            border: 2px solid var(--ink);
            border-radius: 5px 3px 6px 4px / 4px 5px 3px 6px;
            background: var(--button-bg);
            color: var(--ink);
            cursor: pointer;
            letter-spacing: 1px;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s;
            box-shadow: 2px 3px 0 var(--shadow-dark);
        }
        .btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 4px 0 var(--shadow-dark); background: var(--button-hover); }
        .btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--shadow-dark); }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: 1px 1px 0 var(--shadow-dark) !important; }
        .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn.primary:hover { background: #6e3610; }
        .btn.danger { background: var(--color-danger); color: #fff; border-color: var(--color-danger); }
        .btn.ghost { background: transparent; border-color: var(--border-light); color: var(--text-secondary); box-shadow: 1px 1px 0 var(--shadow); }
        .btn.sm { font-size: 0.7rem; padding: 5px 10px; }

        /* ============== 主容器 ============== */
        .main-container {
            max-width: 920px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }
        .panel {
            background: var(--bg-paper);
            border: 2.5px solid var(--border);
            border-radius: 8px 5px 10px 6px;
            padding: 18px 18px;
            margin-bottom: 16px;
            box-shadow: 4px 6px 0 var(--shadow-dark);
            transform: rotate(-0.15deg);
        }
        .panel h2 {
            font-size: 0.95rem;
            margin: 0 0 12px;
            color: var(--ink);
            border-bottom: 1.5px dashed var(--divider);
            padding-bottom: 7px;
            letter-spacing: 1px;
        }
        .panel h2 .icon { color: var(--accent); margin-right: 6px; }
        .panel p { font-size: 0.8rem; color: var(--text-secondary); margin: 6px 0; }
        .panel .hint { font-size: 0.7rem; color: var(--text-muted); font-style: italic; }

        /* ============== 模拟器演示区 ============== */
        .sim-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        @media (max-width: 640px) {
            .sim-area { grid-template-columns: 1fr; }
            .top-bar { flex-direction: column; gap: 8px; align-items: flex-start; }
            .top-actions { width: 100%; }
        }
        .sim-block {
            background: var(--bg-paper-alt);
            border: 1.5px dashed var(--border-light);
            border-radius: 5px;
            padding: 12px;
        }
        .sim-block h3 {
            font-size: 0.78rem;
            margin: 0 0 8px;
            color: var(--ink-light);
            border-left: 3px solid var(--accent);
            padding-left: 6px;
        }
        .sim-block .row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
        .sim-block label { font-size: 0.7rem; color: var(--text-secondary); display: block; margin-bottom: 2px; }
        .sim-block input, .sim-block textarea {
            width: 100%;
            padding: 6px 8px;
            font-size: 0.72rem;
            font-family: var(--font-main);
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            border-radius: 3px;
            color: var(--text);
            outline: none;
        }
        .sim-block input:focus, .sim-block textarea:focus { border-color: var(--accent); }
        .sim-block textarea { min-height: 70px; resize: vertical; line-height: 1.5; font-family: var(--font-mono); }
        .sim-block .field { margin-bottom: 8px; }
        .lock-overlay {
            position: relative;
        }
        .lock-overlay::after {
            content: '未登录';
            position: absolute;
            inset: 0;
            background: rgba(60,50,40,0.55);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            letter-spacing: 3px;
            border-radius: 5px;
            z-index: 2;
            backdrop-filter: blur(1px);
        }

        /* ============== 模态弹窗 ============== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--overlay);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            backdrop-filter: blur(2px);
        }
        .modal-overlay.hidden { display: none; }
        .auth-panel {
            background: var(--modal-bg);
            border: 2.5px solid var(--modal-border);
            border-radius: 9px 5px 11px 7px / 6px 10px 5px 12px;
            padding: 22px 22px 18px;
            max-width: 380px;
            width: 100%;
            box-shadow: 6px 8px 0 var(--shadow-dark);
            transform: rotate(-0.4deg);
            position: relative;
            animation: pop-in 0.3s ease-out;
        }
        @keyframes pop-in {
            0% { transform: rotate(-0.4deg) scale(0.85); opacity: 0; }
            100% { transform: rotate(-0.4deg) scale(1); opacity: 1; }
        }
        .auth-panel::before {
            content: '';
            position: absolute;
            inset: 5px;
            border: 1px dashed rgba(0,0,0,0.18);
            border-radius: 8px 4px 10px 6px / 5px 9px 4px 11px;
            pointer-events: none;
        }
        .auth-title {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--ink);
            letter-spacing: 4px;
            margin-bottom: 4px;
        }
        .auth-subtitle {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            letter-spacing: 1px;
        }
        .auth-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 14px;
            border-bottom: 2px solid var(--border-light);
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            font-size: 0.78rem;
            cursor: pointer;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: var(--font-main);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
            letter-spacing: 1px;
        }
        .auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: bold; }
        .auth-tab:hover:not(.active) { color: var(--ink-light); }
        .auth-field { margin-bottom: 12px; }
        .auth-field label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 3px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .auth-field input {
            width: 100%;
            padding: 8px 11px;
            font-size: 0.8rem;
            font-family: var(--font-main);
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 4px 7px 4px 6px;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .auth-field input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(139,69,19,0.15); }
        .auth-field input::placeholder { color: var(--text-muted); opacity: 0.7; }
        .auth-msg {
            font-size: 0.72rem;
            min-height: 18px;
            margin: 8px 0;
            text-align: center;
            padding: 0 4px;
        }
        .auth-msg.error { color: var(--color-danger); }
        .auth-msg.success { color: var(--color-success); }
        .auth-msg.info { color: var(--color-info); }
        .auth-msg.warn { color: var(--color-warn); }
        .auth-actions {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }
        .auth-actions .btn { flex: 1; }
        .auth-divider {
            display: flex;
            align-items: center;
            margin: 14px 0;
            color: var(--text-muted);
            font-size: 0.65rem;
        }
        .auth-divider::before, .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--divider);
        }
        .auth-divider span { padding: 0 8px; letter-spacing: 2px; }
        .guest-btn {
            width: 100%;
            background: transparent;
            border: 1.5px dashed var(--border-light);
            color: var(--text-secondary);
            padding: 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-main);
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .guest-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--button-hover); }
        .guest-tip {
            font-size: 0.62rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 6px;
            line-height: 1.5;
            font-style: italic;
        }

        /* ============== 全局提示条 ============== */
        .toast-container {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            width: 90%;
            max-width: 420px;
        }
        .toast {
            background: var(--modal-bg);
            border: 2px solid var(--modal-border);
            border-radius: 5px 3px 6px 4px;
            padding: 9px 14px;
            font-size: 0.78rem;
            box-shadow: 3px 4px 0 var(--shadow-dark);
            transform: rotate(-0.3deg);
            animation: toast-in 0.25s ease-out;
            color: var(--ink);
            pointer-events: auto;
        }
        .toast.error { border-color: var(--color-danger); color: var(--color-danger); }
        .toast.success { border-color: var(--color-success); color: var(--color-success); }
        .toast.warn { border-color: var(--color-warn); color: var(--color-warn); }
        .toast.info { border-color: var(--color-info); color: var(--color-info); }
        @keyframes toast-in {
            0% { opacity: 0; transform: rotate(-0.3deg) translateY(-12px); }
            100% { opacity: 1; transform: rotate(-0.3deg) translateY(0); }
        }
        .toast.fade-out { animation: toast-out 0.3s ease-in forwards; }
        @keyframes toast-out {
            0% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-12px); }
        }

        /* ============== JSON 显示区 ============== */
        .json-view {
            background: #2a2520;
            color: #e8dcc8;
            border: 1.5px solid var(--border);
            border-radius: 4px;
            padding: 10px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 220px;
            overflow-y: auto;
            margin-top: 6px;
        }
        .json-view::-webkit-scrollbar { width: 6px; }
        .json-view::-webkit-scrollbar-thumb { background: #6b5e4a; border-radius: 3px; }

        /* ============== 滚动条 ============== */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .footer-note {
            text-align: center;
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 20px;
            line-height: 1.7;
            font-style: italic;
        }
        .footer-note .danger-text { color: var(--color-danger); font-weight: bold; }
    </style>
</head>
<body>
    <!-- 顶部栏 -->
    <div class="top-bar">
        <div class="top-title"><span class="logo">✦</span>代号：ZDay · 通行证</div>
        <div class="top-actions">
            <span class="session-info" id="sessionInfo"><span class="dot"></span>未登录</span>
            <button class="btn sm" id="btnManualSave">手动存档</button>
            <button class="btn sm" id="btnReloadSave">读取存档</button>
            <button class="btn sm ghost" id="btnSwitchAccount">切换账号</button>
            <button class="btn sm ghost" id="btnTheme">浅色</button>
        </div>
    </div>

    <!-- 主区域 -->
    <div class="main-container">
        <div class="panel">
            <h2><span class="icon">▣</span>存档控制台</h2>
            <p>此页面演示 OTS 云端存档 + 游客本地存档机制。未登录状态下，下方操作区将被锁定。</p>

            <div class="sim-area">
                <div class="sim-block lock-overlay" id="simBlock">
                    <h3>玩家信息 / 修改属性</h3>
                    <div class="field">
                        <label>昵称</label>
                        <input type="text" id="editName" placeholder="无名幸存者">
                    </div>
                    <div class="row">
                        <div class="field" style="flex:1;">
                            <label>饱腹 (%)</label>
                            <input type="number" id="editHunger" value="50" min="0" max="100">
                        </div>
                        <div class="field" style="flex:1;">
                            <label>疲劳 (%)</label>
                            <input type="number" id="editFatigue" value="30" min="0" max="100">
                        </div>
                    </div>
                    <div class="row">
                        <button class="btn sm primary" id="btnApplyChange">应用到存档</button>
                        <button class="btn sm" id="btnRandomChange">随机扰动</button>
                    </div>
                </div>

                <div class="sim-block">
                    <h3>当前存档 JSON</h3>
                    <div class="hint" id="saveMeta">尚无存档</div>
                    <div class="json-view" id="jsonView">{}</div>
                </div>
            </div>
        </div>

        <div class="footer-note">
            <span class="danger-text">⚠ 安全警告：</span>
            前端明文携带 OTS 密钥存在严重泄露风险，仅适合个人测试，请勿公开部署。<br>
            密码采用 SHA256 哈希传输与存储，但不抵御中间人攻击，正式商用需后端中转签名。
        </div>
    </div>

    <!-- 登录/注册弹窗 -->
    <div class="modal-overlay" id="authModal">
        <div class="auth-panel">
            <div class="auth-title">通 行 证</div>
            <div class="auth-subtitle">云端存档 · 永不丢失</div>

            <div class="auth-tabs">
                <button class="auth-tab active" data-mode="login">登 录</button>
                <button class="auth-tab" data-mode="register">注 册</button>
            </div>

            <div class="auth-field">
                <label>用户名</label>
                <input type="text" id="inputUsername" placeholder="3-20 位字母/数字/下划线" autocomplete="off">
            </div>
            <div class="auth-field">
                <label>密码</label>
                <input type="password" id="inputPassword" placeholder="至少 6 位" autocomplete="off">
            </div>

            <div class="auth-msg" id="authMsg"></div>

            <div class="auth-actions">
                <button class="btn primary" id="btnSubmit">登 录</button>
                <button class="btn ghost" id="btnReset">重 置</button>
            </div>

            <div class="auth-divider"><span>或</span></div>

            <button class="guest-btn" id="btnGuest">游 客 游 玩</button>
            <div class="guest-tip">
                游客不接入云端，存档仅保存在浏览器本地。<br>
                清除浏览器数据即丢失，可随时注册账号迁移至云端。
            </div>
        </div>
    </div>

    <!-- 全局提示容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
    /* ============================================================================
     *  模块分层说明（自上而下）：
     *    1. 全局配置区        —— OTS 实例/密钥/表名参数
     *    2. 全局状态管理       —— 登录态、当前用户、存档、自动存档计时器
     *    3. 加密工具          —— SHA256 哈希
     *    4. 限流工具          —— 3 秒最小请求间隔
     *    5. OTS 客户端初始化  —— 表格存储 SDK 封装
     *    6. OTS 数据交互逻辑  —— register / login / loadSave / saveSave
     *    7. 存档逻辑          —— 默认模板、本地存档、自动存档、退出保存、节流锁
     *    8. UI 交互           —— 弹窗、表单、Toast、模拟器操作区
     * ========================================================================== */

    /* ========================== 1. 全局配置区 ========================== */
    /**
     * OTS 实例与密钥配置。
     * ⚠ 严禁硬编码密钥到代码中！以下变量留空，请部署时填入私人密钥。
     * 强烈建议为该 AccessKey 配置最小权限 RAM 策略：仅允许读写 user_config 表。
     */
    const OTS_CONFIG = {
        ACCESS_KEY_ID:     "LTAI5t5pKRziEw1RaXnVN8ov",                              // 阿里云 AccessKey ID（必填）
        ACCESS_KEY_SECRET: "ol7H6TLC5GcwZiXrVSqtctlQVRAMSd",                              // 阿里云 AccessKey Secret（必填）
        OTS_ENDPOINT:      "https://j02awtmtne0w.cn-shanghai.ots.aliyuncs.com",                              // 实例访问地址，公网 Endpoint
        INSTANCE_NAME:     "j02awtmtne0w",                  // OTS 实例名称
        TABLE_NAME:        "user_config",                   // 数据表名称
        PRIMARY_KEY:       "username"                       // 主键名（字符串类型）
    };

    /** OTS 请求统一最小间隔（毫秒），用于限流 */
    const OTS_MIN_INTERVAL_MS = 3000;

    /** 自动存档间隔（毫秒），默认 60 秒 */
    const AUTO_SAVE_INTERVAL_MS = 60000;

    /** 游客本地存档 Storage Key */
    const GUEST_STORAGE_KEY = "zday_guest_savedata";

    /** 会话保持 Storage Key（用于刷新后恢复登录态） */
    const SESSION_STORAGE_KEY = "zday_session";

    /* ========================== 2. 全局状态管理 ========================== */
    /**
     * 全局会话状态：
     *   mode: 'none' | 'cloud' | 'guest'
     *   username: 当前用户名（游客为 null）
     *   saveData: 当前内存中的存档对象
     *   autoSaveTimer: 自动存档计时器引用
     *   saveLock: 存档节流锁（true 表示有保存正在进行）
     */
    const AppState = {
        mode: 'none',
        username: null,
        saveData: null,
        autoSaveTimer: null,
        saveLock: false
    };

    /* ========================== 3. 加密工具 ========================== */
    /**
     * 使用 CryptoJS 对密码进行 SHA256 哈希。
     * 注意：前端哈希仅防止明文传输，无法抵御中间人攻击。
     * @param {string} password 明文密码
     * @returns {string} 64 位小写十六进制哈希字符串
     */
    function hashPassword(password) {
        if (typeof CryptoJS === 'undefined') {
            throw new Error('CryptoJS 未加载，无法完成哈希加密');
        }
        return CryptoJS.SHA256(password).toString(CryptoJS.enc.Hex);
    }

    /* ========================== 4. 限流工具 ========================== */
    /**
     * 请求限流器：保证同一函数两次调用间隔 ≥ OTS_MIN_INTERVAL_MS。
     * 短时间重复调用会被拦截并返回限流错误。
     * 每个 key 维护独立的最近调用时间戳。
     */
    const RateLimiter = (() => {
        const STORAGE_KEY = 'zday_ratelimit';
        // 限流状态优先从 sessionStorage 恢复，防刷新绕过
        let lastCallMap = new Map();
        try {
            const saved = sessionStorage.getItem(STORAGE_KEY);
            if (saved) {
                const obj = JSON.parse(saved);
                Object.keys(obj).forEach(k => lastCallMap.set(k, obj[k]));
            }
        } catch (e) {}

        function persist() {
            try {
                const obj = {};
                lastCallMap.forEach((v, k) => obj[k] = v);
                sessionStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
            } catch (e) {}
        }

        /**
         * 检查是否允许调用。
         * @param {string} key 限流键（如函数名）
         * @returns {{ allowed: boolean, waitMs: number }}
         */
        function check(key) {
            const now = Date.now();
            const last = lastCallMap.get(key) || 0;
            const elapsed = now - last;
            if (elapsed < OTS_MIN_INTERVAL_MS) {
                return { allowed: false, waitMs: OTS_MIN_INTERVAL_MS - elapsed };
            }
            return { allowed: true, waitMs: 0 };
        }

        /** 记录一次成功调用的时间戳 */
        function record(key) {
            lastCallMap.set(key, Date.now());
            persist();
        }

        return { check, record };
    })();

    /**
     * 包装一个 OTS 异步函数，自动应用限流。
     * 被限流时直接返回 { success:false, msg:'操作过于频繁，请稍后重试' }。
     * @param {string} key 限流键
     * @param {() => Promise<{success,data,msg}>} fn 业务函数
     */
    async function withRateLimit(key, fn) {
        const { allowed, waitMs } = RateLimiter.check(key);
        if (!allowed) {
            return {
                success: false,
                data: null,
                msg: `操作过于频繁，请稍后重试（约 ${Math.ceil(waitMs / 1000)} 秒后）`
            };
        }
        const result = await fn();
        // 仅在请求确实发出后记录时间戳
        RateLimiter.record(key);
        return result;
    }

    /* ========================== 5. OTS 客户端初始化 ========================== */
    /**
     * 初始化 OTS Client。
     * 注意：tablestore npm 包主要面向 Node.js 环境，浏览器中可能因缺少
     * Buffer/process 等 polyfill 而报错。若 SDK 加载失败或初始化失败，
     * 后续调用会返回统一的错误对象，便于上层处理。
     */
    let otsClient = null;
    function initOTSClient() {
        if (otsClient) return otsClient;
        try {
            if (typeof TableStore === 'undefined') {
                throw new Error('OTS SDK 未加载，请检查 CDN 引入是否成功');
            }
            if (!OTS_CONFIG.ACCESS_KEY_ID || !OTS_CONFIG.ACCESS_KEY_SECRET || !OTS_CONFIG.OTS_ENDPOINT) {
                throw new Error('OTS 配置缺失：请先填入 ACCESS_KEY_ID / ACCESS_KEY_SECRET / OTS_ENDPOINT');
            }
            // tablestore 浏览器端初始化参数
            otsClient = new TableStore.Client({
                accessKeyId:     OTS_CONFIG.ACCESS_KEY_ID,
                accessKeySecret: OTS_CONFIG.ACCESS_KEY_SECRET,
                endpoint:        OTS_CONFIG.OTS_ENDPOINT,
                instancename:    OTS_CONFIG.INSTANCE_NAME,
                secure:          true   // 强制 HTTPS
            });
            return otsClient;
        } catch (err) {
            console.error('[OTS] 初始化失败：', err);
            otsClient = null;
            throw err;
        }
    }

    /* ========================== 6. OTS 数据交互逻辑 ========================== */

    /**
     * 统一返回格式：{ success: boolean, data: any|null, msg: string }
     * 以下四个核心函数均返回该格式。
     */

    /**
     * 1) 账号注册
     *    - 检测用户名是否已存在；存在则失败
     *    - 不存在则写入新行，password 字段存储 SHA256 哈希
     *    - 同时写入默认空存档
     * @param {string} username 用户名
     * @param {string} password 明文密码
     * @param {object} defaultSaveData 默认存档对象
     */
    async function registerAccount(username, password, defaultSaveData) {
        return await withRateLimit('register', async () => {
            try {
                const client = initOTSClient();

                // ① 查询用户名是否已存在
                const queryResp = await client.getRow({
                    tableName: OTS_CONFIG.TABLE_NAME,
                    primaryKey: [{ [OTS_CONFIG.PRIMARY_KEY]: username }],
                    columnFilter: null,
                    maxVersions: 1
                });

                // 若已存在记录则注册失败
                if (queryResp && queryResp.row && queryResp.row.primaryKey && queryResp.row.primaryKey.length > 0) {
                    return { success: false, data: null, msg: '用户名已存在，请更换或直接登录' };
                }

                // ② 写入新行
                const passwordHash = hashPassword(password);
                const saveStr = JSON.stringify(defaultSaveData);
                await client.putRow({
                    tableName: OTS_CONFIG.TABLE_NAME,
                    condition: new TableStore.Condition(TableStore.RowExistenceExpectation.NOT_EXIST, null),
                    primaryKey: [{ [OTS_CONFIG.PRIMARY_KEY]: username }],
                    attributeColumns: [
                        { passwordHash },
                        { savedata: saveStr }
                    ]
                });

                return { success: true, data: { username }, msg: '注册成功' };
            } catch (err) {
                return wrapOTSError(err, '注册失败');
            }
        });
    }

    /**
     * 2) 账号登录
     *    - 输入密码 SHA256 后与数据库哈希比对
     *    - 匹配返回成功，否则失败
     * @param {string} username 用户名
     * @param {string} password 明文密码
     */
    async function loginAccount(username, password) {
        return await withRateLimit('login', async () => {
            try {
                const client = initOTSClient();

                const resp = await client.getRow({
                    tableName: OTS_CONFIG.TABLE_NAME,
                    primaryKey: [{ [OTS_CONFIG.PRIMARY_KEY]: username }],
                    columnFilter: null,
                    maxVersions: 1
                });

                // 账号不存在
                if (!resp || !resp.row || !resp.row.primaryKey || resp.row.primaryKey.length === 0) {
                    return { success: false, data: null, msg: '用户名不存在，请先注册' };
                }

                // 解析列数据
                const columns = parseAttributeColumns(resp.row.attributeColumns || []);
                const storedHash = columns.passwordHash;
                if (!storedHash) {
                    return { success: false, data: null, msg: '账号数据异常：缺少密码字段' };
                }

                const inputHash = hashPassword(password);
                if (inputHash !== storedHash) {
                    return { success: false, data: null, msg: '密码错误，请重试' };
                }

                return { success: true, data: { username }, msg: '登录成功' };
            } catch (err) {
                return wrapOTSError(err, '登录失败');
            }
        });
    }

    /**
     * 3) 读取存档
     *    - 账号存在但无 savedata 字段或为空时，返回默认存档模板
     * @param {string} username 用户名
     */
    async function loadSave(username) {
        return await withRateLimit('loadSave', async () => {
            try {
                const client = initOTSClient();

                const resp = await client.getRow({
                    tableName: OTS_CONFIG.TABLE_NAME,
                    primaryKey: [{ [OTS_CONFIG.PRIMARY_KEY]: username }],
                    columnFilter: null,
                    maxVersions: 1
                });

                if (!resp || !resp.row || !resp.row.primaryKey || resp.row.primaryKey.length === 0) {
                    return { success: false, data: null, msg: '账号不存在' };
                }

                const columns = parseAttributeColumns(resp.row.attributeColumns || []);
                let saveStr = columns.savedata;

                // 空存档返回默认模板
                if (!saveStr) {
                    return { success: true, data: createDefaultSaveData(), msg: '该账号暂无存档，已生成默认存档' };
                }

                let parsed;
                try {
                    parsed = JSON.parse(saveStr);
                } catch (e) {
                    return { success: true, data: createDefaultSaveData(), msg: '存档数据解析失败，已重置为默认存档' };
                }
                return { success: true, data: parsed, msg: '存档读取成功' };
            } catch (err) {
                return wrapOTSError(err, '存档读取失败');
            }
        });
    }

    /**
     * 4) 写入/更新存档
     *    - 仅更新 savedata 字段，不修改 passwordHash
     *    - 禁止任何删除行/删除表操作，符合最小 RAM 权限
     * @param {string} username 用户名
     * @param {object} saveData 完整存档对象
     */
    async function saveSave(username, saveData) {
        return await withRateLimit('saveSave', async () => {
            try {
                const client = initOTSClient();

                // 自动补全 lastSaveTime
                const dataToSave = Object.assign({}, saveData, {
                    lastSaveTime: new Date().toISOString()
                });
                const saveStr = JSON.stringify(dataToSave);

                await client.updateRow({
                    tableName: OTS_CONFIG.TABLE_NAME,
                    condition: new TableStore.Condition(TableStore.RowExistenceExpectation.EXPECT_EXIST, null),
                    primaryKey: [{ [OTS_CONFIG.PRIMARY_KEY]: username }],
                    updateOfAttributeColumns: [{
                        PUT: [{ savedata: saveStr }]
                    }]
                });

                return { success: true, data: dataToSave, msg: '存档保存成功' };
            } catch (err) {
                return wrapOTSError(err, '存档保存失败');
            }
        });
    }

    /**
     * 解析 OTS 返回的 attributeColumns 数组为 { fieldName: value } 平铺对象。
     * SDK 返回结构差异较大，做兼容处理。
     */
    function parseAttributeColumns(attrColumns) {
        const result = {};
        if (!Array.isArray(attrColumns)) return result;
        attrColumns.forEach(item => {
            // 常见形态：{ columnName, value, timestamp } 或 [name, value]
            if (item && typeof item === 'object') {
                const name = item.columnName || item.name;
                const val = item.value;
                if (name) result[name] = val;
            } else if (Array.isArray(item) && item.length >= 2) {
                result[item[0]] = item[1];
            }
        });
        return result;
    }

    /**
     * 统一包装 OTS 异常，区分网络错误、权限错误、服务报错等。
     */
    function wrapOTSError(err, prefix) {
        const msg = (err && err.message) ? err.message : String(err);
        let detail = prefix;
        if (/Unauthorized|AccessDenied|SignatureDoesNotMatch|Forbidden|403/i.test(msg)) {
            detail = `${prefix}：权限不足或密钥错误`;
        } else if (/Network|fetch|ECONNREFUSED|timeout|Failed to fetch|network/i.test(msg)) {
            detail = `${prefix}：网络错误，请检查网络或 OTS Endpoint 配置`;
        } else if (/OTS|TableStore|Quota|RequestID|5\d{2}/i.test(msg)) {
            detail = `${prefix}：OTS 服务报错（${msg.slice(0, 80)}）`;
        } else if (/SDK 未加载|配置缺失|CryptoJS/i.test(msg)) {
            detail = `${prefix}：${msg}`;
        } else {
            detail = `${prefix}：${msg.slice(0, 100)}`;
        }
        console.error(`[OTS] ${prefix}:`, err);
        return { success: false, data: null, msg: detail };
    }

    /* ========================== 7. 存档逻辑 ========================== */

    /**
     * 生成默认存档模板（与云端 savedata 结构一致）。
     * 注册新账号或读取空存档时使用。
     */
    function createDefaultSaveData() {
        return {
            playerInfo: {
                name: '无名幸存者',
                hunger: 50,
                thirst: 50,
                fatigue: 30,
                bodyTemp: 37,
                mentality: '稳定'
            },
            gameProgress: {
                day: 1,
                phase: '清晨',
                location: '废弃营地'
            },
            inventory: [
                { name: '矿泉水', count: 1 },
                { name: '压缩饼干', count: 2 }
            ],
            flags: {
                tutorialDone: false
            },
            lastSaveTime: new Date().toISOString()
        };
    }

    /**
     * 启动自动存档计时器。
     * 切换账号/进入游客/页面关闭时必须先停止。
     */
    function startAutoSaveTimer() {
        stopAutoSaveTimer();
        AppState.autoSaveTimer = setInterval(() => {
            doSaveSilent();
        }, AUTO_SAVE_INTERVAL_MS);
        console.log(`[AutoSave] 计时器已启动，间隔 ${AUTO_SAVE_INTERVAL_MS / 1000}s`);
    }

    /** 停止自动存档计时器 */
    function stopAutoSaveTimer() {
        if (AppState.autoSaveTimer) {
            clearInterval(AppState.autoSaveTimer);
            AppState.autoSaveTimer = null;
            console.log('[AutoSave] 计时器已停止');
        }
    }

    /**
     * 内部保存函数：带节流锁，避免上次保存未完成时发起新保存。
     * 仅云端账号模式调用 OTS；游客模式写入 LocalStorage。
     */
    async function doSave(withFeedback = true) {
        if (AppState.mode === 'none' || !AppState.saveData) {
            if (withFeedback) showToast('warn', '当前无存档可保存');
            return { success: false, data: null, msg: '无存档' };
        }
        // 节流锁
        if (AppState.saveLock) {
            if (withFeedback) showToast('warn', '上一次保存尚未完成，已跳过本次保存');
            return { success: false, data: null, msg: '保存进行中' };
        }
        AppState.saveLock = true;
        try {
            if (AppState.mode === 'cloud') {
                const res = await saveSave(AppState.username, AppState.saveData);
                if (res.success) {
                    AppState.saveData = res.data;
                    refreshJsonView();
                    if (withFeedback) showToast('success', '云端存档保存成功');
                } else {
                    if (withFeedback) showToast('error', res.msg);
                }
                return res;
            } else {
                // 游客模式写入 LocalStorage
                const data = Object.assign({}, AppState.saveData, {
                    lastSaveTime: new Date().toISOString()
                });
                localStorage.setItem(GUEST_STORAGE_KEY, JSON.stringify(data));
                AppState.saveData = data;
                refreshJsonView();
                if (withFeedback) showToast('success', '本地存档保存成功');
                return { success: true, data, msg: '本地存档保存成功' };
            }
        } finally {
            AppState.saveLock = false;
        }
    }

    /** 静默保存（自动存档/退出前保存调用，不弹 Toast） */
    async function doSaveSilent() {
        return await doSave(false);
    }

    /**
     * 页面退出前保存。
     * 兼容浏览器限制：使用 sendBeacon 思路——但 OTS SDK 不支持同步请求，
     * 因此对云端账号采用「触发 Promise 并尽力完成」策略，配合 navigator.sendBeacon 不可行时
     * 至少保证游客 LocalStorage 同步写入。
     */
    function saveBeforeExit() {
        if (AppState.mode === 'none' || !AppState.saveData) return;

        if (AppState.mode === 'guest') {
            // LocalStorage 同步写入，可保证完成
            try {
                const data = Object.assign({}, AppState.saveData, {
                    lastSaveTime: new Date().toISOString()
                });
                localStorage.setItem(GUEST_STORAGE_KEY, JSON.stringify(data));
                console.log('[ExitSave] 游客存档已同步至 LocalStorage');
            } catch (e) {
                console.error('[ExitSave] 游客存档保存失败', e);
            }
        } else if (AppState.mode === 'cloud') {
            // 云端账号：发起异步保存（浏览器不保证完成）
            // 使用 fetch keepalive 提升完成概率；OTS SDK 内部 fetch 不一定支持 keepalive，
            // 这里直接调用并依赖浏览器在 unload 期间尽力完成。
            console.log('[ExitSave] 触发云端存档（浏览器可能不保证完成）');
            doSaveSilent();
        }
    }

    /* ========================== 8. UI 交互 ========================== */

    /* ---------- 8.1 Toast 提示 ---------- */
    /**
     * 弹出全局 Toast。
     * @param {'info'|'success'|'warn'|'error'} type
     * @param {string} text
     * @param {number} duration 持续毫秒
     */
    function showToast(type, text, duration = 2800) {
        const container = document.getElementById('toastContainer');
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.textContent = text;
        container.appendChild(el);
        setTimeout(() => {
            el.classList.add('fade-out');
            setTimeout(() => el.remove(), 300);
        }, duration);
    }

    /* ---------- 8.2 弹窗表单 ---------- */
    let currentAuthMode = 'login'; // 'login' | 'register'

    /** 切换登录/注册模式 */
    function switchAuthMode(mode) {
        currentAuthMode = mode;
        document.querySelectorAll('.auth-tab').forEach(t => {
            t.classList.toggle('active', t.dataset.mode === mode);
        });
        const submitBtn = document.getElementById('btnSubmit');
        submitBtn.textContent = mode === 'login' ? '登 录' : '注 册';
        setAuthMsg('', '');
    }

    /** 设置弹窗内提示信息 */
    function setAuthMsg(type, text) {
        const el = document.getElementById('authMsg');
        el.className = 'auth-msg' + (type ? ' ' + type : '');
        el.textContent = text || '';
    }

    /** 显示/隐藏弹窗 */
    function showAuthModal() {
        document.getElementById('authModal').classList.remove('hidden');
    }
    function hideAuthModal() {
        document.getElementById('authModal').classList.add('hidden');
    }

    /** 重置表单 */
    function resetAuthForm() {
        document.getElementById('inputUsername').value = '';
        document.getElementById('inputPassword').value = '';
        setAuthMsg('', '');
    }

    /** 表单基础校验：返回 {valid, msg} */
    function validateForm(username, password) {
        if (!username || !username.trim()) {
            return { valid: false, msg: '用户名不能为空' };
        }
        if (!password) {
            return { valid: false, msg: '密码不能为空' };
        }
        if (username.trim().length < 3 || username.trim().length > 20) {
            return { valid: false, msg: '用户名长度需 3-20 位' };
        }
        if (!/^[A-Za-z0-9_]+$/.test(username.trim())) {
            return { valid: false, msg: '用户名仅允许字母、数字、下划线' };
        }
        if (password.length < 6) {
            return { valid: false, msg: '密码至少 6 位' };
        }
        return { valid: true, msg: '' };
    }

    /** 处理登录/注册提交 */
    async function handleSubmit() {
        const username = document.getElementById('inputUsername').value.trim();
        const password = document.getElementById('inputPassword').value;

        const v = validateForm(username, password);
        if (!v.valid) {
            setAuthMsg('error', v.msg);
            return;
        }

        const submitBtn = document.getElementById('btnSubmit');
        submitBtn.disabled = true;
        const originalText = submitBtn.textContent;
        submitBtn.textContent = '处理中…';

        try {
            if (currentAuthMode === 'register') {
                // 注册：读取本地游客存档作为初始存档（若有），否则使用默认模板
                const initialSave = readGuestLocalSave() || createDefaultSaveData();
                setAuthMsg('info', '正在注册账号…');
                const reg = await registerAccount(username, password, initialSave);
                if (!reg.success) {
                    setAuthMsg('error', reg.msg);
                    return;
                }
                setAuthMsg('success', '注册成功，正在自动登录…');

                // 注册成功自动登录
                const login = await loginAccount(username, password);
                if (!login.success) {
                    setAuthMsg('error', `注册成功但登录失败：${login.msg}`);
                    return;
                }
                await enterCloudMode(username, true); // true: 来自注册，迁移本地游客存档
            } else {
                // 登录
                setAuthMsg('info', '正在登录…');
                const login = await loginAccount(username, password);
                if (!login.success) {
                    setAuthMsg('error', login.msg);
                    return;
                }
                await enterCloudMode(username, false);
            }
        } catch (err) {
            setAuthMsg('error', `发生异常：${err.message || err}`);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
        }
    }

    /** 进入云端账号模式：加载存档、启动自动存档、关闭弹窗 */
    async function enterCloudMode(username, fromRegister) {
        setAuthMsg('info', '正在加载云端存档…');
        const loadRes = await loadSave(username);
        if (!loadRes.success) {
            setAuthMsg('error', `存档加载失败：${loadRes.msg}`);
            return;
        }

        // 若是注册时迁移了游客存档，注册接口已写入；这里直接使用返回的存档
        AppState.mode = 'cloud';
        AppState.username = username;
        AppState.saveData = loadRes.data;

        // 持久化会话（刷新后可恢复登录态，仅作为前端提示；真实安全需后端）
        try {
            localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({ mode: 'cloud', username }));
        } catch (e) {}

        hideAuthModal();
        resetAuthForm();
        updateSessionInfo();
        refreshJsonView();
        refreshSimForm();
        unlockSimArea();
        startAutoSaveTimer();

        // 注册迁移成功后清除本地游客存档，避免下次游客模式读到旧档
        if (fromRegister) {
            try { localStorage.removeItem(GUEST_STORAGE_KEY); } catch (e) {}
            showToast('success', `注册成功并已登录，本地游客存档已迁移至云端`);
        } else {
            showToast('success', `登录成功，已加载云端存档`);
        }
    }

    /** 进入游客模式
     * @param {boolean} isRestore 是否为页面刷新后自动恢复（影响提示文案）
     */
    function enterGuestMode(isRestore = false) {
        AppState.mode = 'guest';
        AppState.username = null;

        // 读取本地游客存档；不存在则新建默认存档
        const local = readGuestLocalSave();
        AppState.saveData = local || createDefaultSaveData();
        if (!local) {
            writeGuestLocalSave(AppState.saveData);
        }

        try {
            localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({ mode: 'guest', username: null }));
        } catch (e) {}

        hideAuthModal();
        updateSessionInfo();
        refreshJsonView();
        refreshSimForm();
        unlockSimArea();
        startAutoSaveTimer();

        if (isRestore) {
            showToast('info', '已恢复上次游客进度（存档仅保存在本地浏览器）');
        } else {
            showToast('info', '已进入游客模式，存档仅保存在本地浏览器');
        }
    }

    /** 退出当前模式（切换账号/退出游客） */
    function exitCurrentMode() {
        stopAutoSaveTimer();
        // 退出前尽力保存一次
        saveBeforeExit();
        AppState.mode = 'none';
        AppState.username = null;
        AppState.saveData = null;
        try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) {}
        updateSessionInfo();
        refreshJsonView();
        refreshSimForm();
        lockSimArea();
        showAuthModal();
    }

    /* ---------- 8.3 本地游客存档读写 ---------- */
    function readGuestLocalSave() {
        try {
            const str = localStorage.getItem(GUEST_STORAGE_KEY);
            if (!str) return null;
            return JSON.parse(str);
        } catch (e) {
            console.warn('[Guest] 本地存档解析失败', e);
            return null;
        }
    }
    function writeGuestLocalSave(data) {
        try {
            localStorage.setItem(GUEST_STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
            console.error('[Guest] 本地存档写入失败', e);
        }
    }

    /* ---------- 8.4 会话信息与模拟器区刷新 ---------- */
    function updateSessionInfo() {
        const el = document.getElementById('sessionInfo');
        if (AppState.mode === 'cloud') {
            el.className = 'session-info cloud';
            el.innerHTML = `<span class="dot"></span>云端：${escapeHtml(AppState.username)}`;
        } else if (AppState.mode === 'guest') {
            el.className = 'session-info guest';
            el.innerHTML = `<span class="dot"></span>游客模式`;
        } else {
            el.className = 'session-info';
            el.innerHTML = `<span class="dot"></span>未登录`;
        }
    }

    function refreshJsonView() {
        const view = document.getElementById('jsonView');
        const meta = document.getElementById('saveMeta');
        if (!AppState.saveData) {
            view.textContent = '{}';
            meta.textContent = '尚无存档';
            return;
        }
        view.textContent = JSON.stringify(AppState.saveData, null, 2);
        const last = AppState.saveData.lastSaveTime || '未知';
        meta.textContent = `最后保存：${last}`;
    }

    function refreshSimForm() {
        if (!AppState.saveData) {
            document.getElementById('editName').value = '';
            document.getElementById('editHunger').value = 50;
            document.getElementById('editFatigue').value = 30;
            return;
        }
        const pi = AppState.saveData.playerInfo || {};
        document.getElementById('editName').value = pi.name || '';
        document.getElementById('editHunger').value = pi.hunger ?? 50;
        document.getElementById('editFatigue').value = pi.fatigue ?? 30;
    }

    function lockSimArea() {
        document.getElementById('simBlock').classList.add('lock-overlay');
    }
    function unlockSimArea() {
        document.getElementById('simBlock').classList.remove('lock-overlay');
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    /* ---------- 8.5 模拟器操作区交互 ---------- */
    /** 将表单中的属性应用到内存存档 */
    function applySimChange() {
        if (AppState.mode === 'none' || !AppState.saveData) {
            showToast('warn', '请先登录或进入游客模式');
            return;
        }
        if (!AppState.saveData.playerInfo) AppState.saveData.playerInfo = {};
        AppState.saveData.playerInfo.name = document.getElementById('editName').value || '无名幸存者';
        AppState.saveData.playerInfo.hunger = Number(document.getElementById('editHunger').value) || 0;
        AppState.saveData.playerInfo.fatigue = Number(document.getElementById('editFatigue').value) || 0;
        refreshJsonView();
        showToast('info', '已应用到存档（点击"手动存档"持久化）');
    }

    /** 随机扰动属性（演示自动存档触发） */
    function randomSimChange() {
        if (AppState.mode === 'none' || !AppState.saveData) {
            showToast('warn', '请先登录或进入游客模式');
            return;
        }
        if (!AppState.saveData.playerInfo) AppState.saveData.playerInfo = {};
        const pi = AppState.saveData.playerInfo;
        pi.hunger = Math.max(0, Math.min(100, (pi.hunger ?? 50) + Math.floor(Math.random() * 21 - 10)));
        pi.fatigue = Math.max(0, Math.min(100, (pi.fatigue ?? 30) + Math.floor(Math.random() * 21 - 10)));
        refreshSimForm();
        refreshJsonView();
        showToast('info', '属性已随机扰动');
    }

    /* ---------- 8.6 主题切换 ---------- */
    function toggleTheme() {
        const cur = document.documentElement.getAttribute('data-theme');
        const next = cur === 'dark' ? 'light' : 'dark';
        if (next === 'light') {
            document.documentElement.removeAttribute('data-theme');
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
        document.getElementById('btnTheme').textContent = next === 'dark' ? '深色' : '浅色';
        try { localStorage.setItem('zday_theme', next); } catch (e) {}
    }

    /* ---------- 8.7 会话恢复（页面刷新后） ---------- */
    function tryRestoreSession() {
        try {
            const str = localStorage.getItem(SESSION_STORAGE_KEY);
            if (!str) return false;
            const sess = JSON.parse(str);
            if (sess.mode === 'cloud' && sess.username) {
                // 仅恢复前端状态显示，真实存档需重新调用 loadSave（需要密码或后端 token）
                // 此处保守起见：不自动恢复云端登录态，强制重新登录（前端无密码无法重建会话）
                // 显示提示，让用户重新登录
                return false;
            }
            if (sess.mode === 'guest') {
                enterGuestMode(true);
                return true;
            }
        } catch (e) {}
        return false;
    }

    /* ========================== 事件绑定与初始化 ========================== */
    document.addEventListener('DOMContentLoaded', () => {
        // 恢复主题
        try {
            const savedTheme = localStorage.getItem('zday_theme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('btnTheme').textContent = '深色';
            }
        } catch (e) {}

        // 标签切换
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => switchAuthMode(tab.dataset.mode));
        });

        // 弹窗按钮
        document.getElementById('btnSubmit').addEventListener('click', handleSubmit);
        document.getElementById('btnReset').addEventListener('click', resetAuthForm);
        document.getElementById('btnGuest').addEventListener('click', enterGuestMode);

        // 回车提交
        document.getElementById('inputPassword').addEventListener('keydown', e => {
            if (e.key === 'Enter') handleSubmit();
        });
        document.getElementById('inputUsername').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('inputPassword').focus();
        });

        // 顶部按钮
        document.getElementById('btnManualSave').addEventListener('click', () => doSave(true));
        document.getElementById('btnReloadSave').addEventListener('click', async () => {
            if (AppState.mode === 'cloud') {
                showToast('info', '正在从云端重新读取存档…');
                const res = await loadSave(AppState.username);
                if (res.success) {
                    AppState.saveData = res.data;
                    refreshJsonView();
                    refreshSimForm();
                    showToast('success', '存档已重新加载');
                } else {
                    showToast('error', res.msg);
                }
            } else if (AppState.mode === 'guest') {
                const local = readGuestLocalSave();
                if (local) {
                    AppState.saveData = local;
                    refreshJsonView();
                    refreshSimForm();
                    showToast('success', '本地存档已重新加载');
                } else {
                    showToast('warn', '本地无游客存档');
                }
            } else {
                showToast('warn', '请先登录或进入游客模式');
            }
        });
        document.getElementById('btnSwitchAccount').addEventListener('click', () => {
            if (AppState.mode === 'none') {
                showAuthModal();
            } else {
                if (confirm('切换账号将退出当前会话并尽力保存当前进度，是否继续？')) {
                    exitCurrentMode();
                }
            }
        });
        document.getElementById('btnTheme').addEventListener('click', toggleTheme);

        // 模拟器区按钮
        document.getElementById('btnApplyChange').addEventListener('click', applySimChange);
        document.getElementById('btnRandomChange').addEventListener('click', randomSimChange);

        // 页面退出前保存（兼容多浏览器事件）
        window.addEventListener('beforeunload', saveBeforeExit);
        window.addEventListener('pagehide', saveBeforeExit);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') saveBeforeExit();
        });

        // 初始化：尝试恢复游客会话；否则弹出登录窗
        const restored = tryRestoreSession();
        if (!restored) {
            showAuthModal();
        }
        updateSessionInfo();
        refreshJsonView();
        refreshSimForm();
        lockSimArea();
    });
    </script>
</body>
</html>
